<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Schematischer Verlauf von Sauerstoff und Kohlenstoffdioxid in der Atmosphäre</title>
  <desc id="d">Zwei Kurven über die letzten 1000 Millionen Jahre. Der Sauerstoffanteil liegt bis etwa 700 Millionen Jahre vor heute unter einem Prozent, steigt dann steil auf rund 12 Prozent, bleibt lange dort und steigt danach auf etwa 21 Prozent. Die obere Linie ist die Summe aus Sauerstoff und Kohlenstoffdioxid und nähert sich am Ende der unteren Linie an.</desc>
