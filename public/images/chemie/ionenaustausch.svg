<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t d">
  <title id="t">Ionenaustauscher</title>
  <desc id="d">Links ein Calcium-Ion im Wasser über einem Harz, dessen SO3-minus-Gruppen H3O-plus tragen. Rechts ist das Calcium an zwei Gruppen gebunden und zwei H3O-plus sind ins Wasser abgegeben.</desc>
  <rect width="780" height="300" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="15" fill="#1f2933">
<rect x="20" y="60" width="340" height="150" fill="#e6f0fa"/><text x="30" y="80" font-size="13" fill="#2b6cb0">Wasser</text><rect x="20" y="210" width="340" height="40" fill="#cbd2d9"/><text x="190" y="236" text-anchor="middle" font-size="13">Harz</text><line x1="130" y1="210" x2="130" y2="185" stroke="#1f2933" stroke-width="2"/><text x="130" y="178" text-anchor="middle" font-size="13">SO₃⁻</text><line x1="250" y1="210" x2="250" y2="185" stroke="#1f2933" stroke-width="2"/><text x="250" y="178" text-anchor="middle" font-size="13">SO₃⁻</text><circle cx="178" cy="172" r="13" fill="#c05621"/><circle cx="298" cy="172" r="13" fill="#c05621"/><text x="190" y="198" text-anchor="middle" font-size="11" fill="#c05621"></text><circle cx="190" cy="110" r="17" fill="#2b6cb0"/><text x="190" y="115" text-anchor="middle" fill="#fff" font-size="13">Ca²⁺</text><line x1="190" y1="130" x2="190" y2="155" stroke="#1f2933" stroke-width="2"/><polyline points="186.1,146.9 190,155 193.9,146.9" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="420" y="60" width="340" height="150" fill="#e6f0fa"/><text x="430" y="80" font-size="13" fill="#2b6cb0">Wasser</text><rect x="420" y="210" width="340" height="40" fill="#cbd2d9"/><text x="590" y="236" text-anchor="middle" font-size="13">Harz</text><line x1="530" y1="210" x2="530" y2="185" stroke="#1f2933" stroke-width="2"/><text x="530" y="178" text-anchor="middle" font-size="13">SO₃⁻</text><line x1="650" y1="210" x2="650" y2="185" stroke="#1f2933" stroke-width="2"/><text x="650" y="178" text-anchor="middle" font-size="13">SO₃⁻</text><circle cx="590" cy="150" r="17" fill="#2b6cb0"/><text x="590" y="155" text-anchor="middle" fill="#fff" font-size="13">Ca²⁺</text><line x1="532" y1="163" x2="578" y2="160" stroke="#1f2933"/><line x1="648" y1="163" x2="602" y2="160" stroke="#1f2933"/><circle cx="480" cy="110" r="17" fill="#c05621"/><text x="480" y="115" text-anchor="middle" fill="#fff" font-size="12">H₃O⁺</text><circle cx="700" cy="120" r="17" fill="#c05621"/><text x="700" y="125" text-anchor="middle" fill="#fff" font-size="12">H₃O⁺</text><line x1="366" y1="150" x2="414" y2="150" stroke="#1f2933" stroke-width="2"/><polyline points="405.9,153.9 414,150 405.9,146.1" fill="none" stroke="#1f2933" stroke-width="2"/><text x="190" y="40" text-anchor="middle" font-size="16">Vorher</text><text x="590" y="40" text-anchor="middle" font-size="16">Nachher</text><text x="190" y="278" text-anchor="middle" font-size="13">Plätze mit H₃O⁺ besetzt (orange)</text><text x="590" y="278" text-anchor="middle" font-size="13">Calcium sitzt fest, 2 H₃O⁺ sind frei</text>
  </g>
</svg>
