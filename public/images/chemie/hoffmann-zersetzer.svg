<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d">
  <title id="t">Hoffmannscher Wasserzersetzer</title>
  <desc id="d">Drei verbundene Rohre mit angesäuertem Wasser: links und rechts je ein Rohr mit Elektrode und Hahn, in der Mitte ein Vorratsrohr mit Trichter. Am Minuspol sammelt sich Wasserstoff, am Pluspol Sauerstoff, im Volumenverhältnis zwei zu eins. Die Elektroden hängen an einer Gleichspannungsquelle.</desc>
  <rect width="780" height="430" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="15" fill="#1f2933">
<rect x="110" y="300" width="340" height="30" fill="#cfe3f5"/><polyline points="170,300 250,300" fill="none" stroke="#1f2933" stroke-width="2"/><polyline points="310,300 390,300" fill="none" stroke="#1f2933" stroke-width="2"/><polyline points="110,80 110,330 450,330 450,80" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="110" y="200" width="60" height="100" fill="#cfe3f5"/><rect x="250" y="110" width="60" height="190" fill="#cfe3f5"/><rect x="390" y="140" width="60" height="160" fill="#cfe3f5"/><line x1="110" y1="80" x2="110" y2="300" stroke="#1f2933" stroke-width="2"/><line x1="170" y1="80" x2="170" y2="300" stroke="#1f2933" stroke-width="2"/><line x1="250" y1="80" x2="250" y2="300" stroke="#1f2933" stroke-width="2"/><line x1="310" y1="80" x2="310" y2="300" stroke="#1f2933" stroke-width="2"/><line x1="390" y1="80" x2="390" y2="300" stroke="#1f2933" stroke-width="2"/><line x1="450" y1="80" x2="450" y2="300" stroke="#1f2933" stroke-width="2"/><line x1="110" y1="80" x2="170" y2="80" stroke="#1f2933" stroke-width="2"/><line x1="390" y1="80" x2="450" y2="80" stroke="#1f2933" stroke-width="2"/><polyline points="230,40 250,80" fill="none" stroke="#1f2933" stroke-width="2"/><polyline points="330,40 310,80" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="130" y="58" width="20" height="20" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="120" y1="68" x2="160" y2="68" stroke="#1f2933" stroke-width="3"/><rect x="410" y="58" width="20" height="20" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="400" y1="68" x2="440" y2="68" stroke="#1f2933" stroke-width="3"/><text x="140" y="150" text-anchor="middle">H₂</text><text x="140" y="172" text-anchor="middle" font-size="12">Gas</text><text x="420" y="102" text-anchor="middle">O₂</text><text x="420" y="118" text-anchor="middle" font-size="12">Gas</text><text x="140" y="190" text-anchor="middle" font-size="12" fill="#2b6cb0">2 Teile</text><text x="420" y="134" text-anchor="middle" font-size="12" fill="#c05621">1 Teil</text><text x="280" y="215" text-anchor="middle" font-size="13">angesäuertes</text><text x="280" y="233" text-anchor="middle" font-size="13">Wasser</text><text x="280" y="28" text-anchor="middle" font-size="13">Vorratsrohr</text><line x1="140" y1="295" x2="140" y2="250" stroke="#1f2933" stroke-width="5"/><line x1="420" y1="295" x2="420" y2="250" stroke="#1f2933" stroke-width="5"/><text x="125" y="360" font-size="28" font-weight="bold" fill="#2b6cb0">−</text><text x="428" y="360" font-size="28" font-weight="bold" fill="#c05621">+</text><polyline points="140,295 140,330 140,380 255,380" fill="none" stroke="#1f2933" stroke-width="2"/><polyline points="270,380 420,380 420,330 420,295" fill="none" stroke="#1f2933" stroke-width="2"/><line x1="255" y1="368" x2="255" y2="392" stroke="#1f2933" stroke-width="4"/><line x1="270" y1="360" x2="270" y2="400" stroke="#1f2933" stroke-width="4"/><text x="262" y="420" text-anchor="middle" font-size="13">Gleichspannungsquelle</text><text x="500" y="150" font-size="14">Kathode (−): 2 H⁺ + 2 e⁻ → H₂</text><text x="500" y="250" font-size="14">Anode (+): 2 H₂O → O₂ + 4 H⁺ + 4 e⁻</text>
  </g>
</svg>
