<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="t d">
  <title id="t">Hoffmannscher Wasserzersetzer</title>
  <desc id="d">Zwei Rohre mit angesäuertem Wasser. Am Minuspol sammelt sich Wasserstoff, am Pluspol Sauerstoff, im Volumenverhältnis zwei zu eins.</desc>
  <rect width="780" height="410" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="15" fill="#1f2933">
<rect x="120" y="60" width="70" height="260" fill="#e6f0fa" stroke="#1f2933" stroke-width="2"/><rect x="121" y="61" width="68" height="160" fill="#2b6cb0" opacity="0.55"/><text x="155" y="146.0" text-anchor="middle">H₂</text><line x1="155" y1="320" x2="155" y2="285" stroke="#1f2933" stroke-width="4"/><text x="155" y="350" text-anchor="middle" font-size="30" font-weight="bold" fill="#2b6cb0">−</text><text x="155" y="48" text-anchor="middle" font-size="13">2 Teile</text><rect x="280" y="60" width="70" height="260" fill="#e6f0fa" stroke="#1f2933" stroke-width="2"/><rect x="281" y="61" width="68" height="80" fill="#c05621" opacity="0.55"/><text x="315" y="106.0" text-anchor="middle">O₂</text><line x1="315" y1="320" x2="315" y2="285" stroke="#1f2933" stroke-width="4"/><text x="315" y="350" text-anchor="middle" font-size="30" font-weight="bold" fill="#c05621">+</text><text x="315" y="48" text-anchor="middle" font-size="13">1 Teil</text><line x1="155" y1="320" x2="155" y2="370" stroke="#1f2933" stroke-width="2"/><line x1="315" y1="320" x2="315" y2="370" stroke="#1f2933" stroke-width="2"/><line x1="155" y1="370" x2="315" y2="370" stroke="#1f2933" stroke-width="2"/><text x="235" y="392" text-anchor="middle" font-size="13">Spannungsquelle</text><text x="410" y="160" font-size="14">Kathode (−): 2 H⁺ + 2 e⁻ → H₂</text><text x="410" y="270" font-size="14">Anode (+): 2 H₂O → O₂ + 4 H⁺ + 4 e⁻</text>
  </g>
</svg>
