<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 470" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Bohrsches Atommodell: Bahnen und Energieniveaus des Wasserstoffatoms</title>
<desc id="d">Links drei Kreisbahnen um das Proton mit den Radien 1, 4 und 9 mal dem Bohrschen Radius. Rechts die Energieniveaus von n gleich 1 bis 6 mit den Serien von Lyman, Balmer und Paschen.</desc>
<rect width="1030" height="470" rx="14" fill="#f7f8fa"/>
<text x="190" y="34" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="700">Bahnen</text>
<circle cx="190" cy="250" r="14" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="205.8994" y="236.1006" font-size="13" text-anchor="start" fill="#1f2933" font-weight="400">n = 1</text>
<circle cx="190" cy="250" r="56" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="235.5976" y="206.4024" font-size="13" text-anchor="start" fill="#1f2933" font-weight="400">n = 2</text>
<circle cx="190" cy="250" r="126" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="285.0946" y="156.9054" font-size="13" text-anchor="start" fill="#1f2933" font-weight="400">n = 3</text>
<circle cx="190" cy="250" r="5" fill="#c05621"/>
<text x="190" y="274" font-size="12" text-anchor="middle" fill="#c05621" font-weight="400">Proton</text>
<circle cx="162.0" cy="201.504" r="5" fill="#2b6cb0"/>
<text x="152.0" y="191.504" font-size="12" text-anchor="end" fill="#2b6cb0" font-weight="400">Elektron</text>
<text x="190" y="418" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="400">Radius r ~ n²: 0,053 nm, 0,21 nm, 0,48 nm</text>
<text x="190" y="440" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="400">Geschwindigkeit v ~ 1/n</text>
<text x="535.0" y="34" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="700">Energieniveaus</text>
<line x1="416" y1="80.0" x2="640" y2="80.0" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="412" y="84.0" font-size="12" text-anchor="end" fill="#1f2933" font-weight="400">0 eV (n = ∞)</text>
<line x1="430" y1="410.0" x2="640" y2="410.0" stroke="#1f2933" stroke-width="3"/>
<text x="412" y="414.0" font-size="12" text-anchor="end" fill="#1f2933" font-weight="400">-13,61 eV</text>
<text x="650" y="414.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="400">n = 1</text>
<line x1="430" y1="162.5" x2="640" y2="162.5" stroke="#1f2933" stroke-width="3"/>
<text x="412" y="166.5" font-size="12" text-anchor="end" fill="#1f2933" font-weight="400">-3,40 eV</text>
<text x="650" y="166.5" font-size="12" text-anchor="start" fill="#1f2933" font-weight="400">n = 2</text>
<line x1="430" y1="116.66666666666669" x2="640" y2="116.66666666666669" stroke="#1f2933" stroke-width="3"/>
<text x="412" y="120.66666666666669" font-size="12" text-anchor="end" fill="#1f2933" font-weight="400">-1,51 eV</text>
<text x="650" y="120.66666666666669" font-size="12" text-anchor="start" fill="#1f2933" font-weight="400">n = 3</text>
<line x1="430" y1="100.625" x2="640" y2="100.625" stroke="#1f2933" stroke-width="3"/>
<line x1="430" y1="93.19999999999999" x2="640" y2="93.19999999999999" stroke="#1f2933" stroke-width="3"/>
<line x1="430" y1="89.16666666666669" x2="640" y2="89.16666666666669" stroke="#1f2933" stroke-width="3"/>
<text x="412" y="97.19999999999999" font-size="12" text-anchor="end" fill="#1f2933" font-weight="400">-0,85 bis -0,38 eV</text>
<text x="650" y="97.19999999999999" font-size="12" text-anchor="start" fill="#1f2933" font-weight="400">n = 4, 5, 6, ...</text>
<line x1="460" y1="162.5" x2="460" y2="402.0" stroke="#2b6cb0" stroke-width="2.4"/>
<polygon points="460,409.0 455,399.0 465,399.0" fill="#2b6cb0"/>
<line x1="480" y1="116.66666666666669" x2="480" y2="402.0" stroke="#2b6cb0" stroke-width="2.4"/>
<polygon points="480,409.0 475,399.0 485,399.0" fill="#2b6cb0"/>
<line x1="500" y1="100.625" x2="500" y2="402.0" stroke="#2b6cb0" stroke-width="2.4"/>
<polygon points="500,409.0 495,399.0 505,399.0" fill="#2b6cb0"/>
<line x1="520" y1="93.19999999999999" x2="520" y2="402.0" stroke="#2b6cb0" stroke-width="2.4"/>
<polygon points="520,409.0 515,399.0 525,399.0" fill="#2b6cb0"/>
<line x1="550" y1="116.66666666666669" x2="550" y2="154.5" stroke="#c05621" stroke-width="2.4"/>
<polygon points="550,161.5 545,151.5 555,151.5" fill="#c05621"/>
<line x1="570" y1="100.625" x2="570" y2="154.5" stroke="#c05621" stroke-width="2.4"/>
<polygon points="570,161.5 565,151.5 575,151.5" fill="#c05621"/>
<line x1="590" y1="93.19999999999999" x2="590" y2="154.5" stroke="#c05621" stroke-width="2.4"/>
<polygon points="590,161.5 585,151.5 595,151.5" fill="#c05621"/>
<line x1="615" y1="100.625" x2="615" y2="108.66666666666669" stroke="#2f855a" stroke-width="2.4"/>
<polygon points="615,115.66666666666669 610,105.66666666666669 620,105.66666666666669" fill="#2f855a"/>
<line x1="635" y1="93.19999999999999" x2="635" y2="108.66666666666669" stroke="#2f855a" stroke-width="2.4"/>
<polygon points="635,115.66666666666669 630,105.66666666666669 640,105.66666666666669" fill="#2f855a"/>
<rect x="738" y="116" width="10" height="38" rx="3" fill="#2b6cb0"/>
<text x="760" y="130" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="700">Lyman-Serie: Rückfall auf n = 1</text>
<text x="760" y="149" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="400">91 bis 122 nm, ultraviolett</text>
<rect x="738" y="186" width="10" height="38" rx="3" fill="#c05621"/>
<text x="760" y="200" font-size="13" text-anchor="start" fill="#c05621" font-weight="700">Balmer-Serie: Rückfall auf n = 2</text>
<text x="760" y="219" font-size="13" text-anchor="start" fill="#c05621" font-weight="400">365 bis 656 nm, sichtbar bis nahes UV</text>
<rect x="738" y="256" width="10" height="38" rx="3" fill="#2f855a"/>
<text x="760" y="270" font-size="13" text-anchor="start" fill="#2f855a" font-weight="700">Paschen-Serie: Rückfall auf n = 3</text>
<text x="760" y="289" font-size="13" text-anchor="start" fill="#2f855a" font-weight="400">820 bis 1875 nm, infrarot</text>
</svg>
