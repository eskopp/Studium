<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 140" role="img" aria-labelledby="t d">
  <title id="t">Phosphat und Gewässer</title>
  <desc id="d">Ursache-Wirkungs-Kette: Phosphat im Abwasser, mehr Algenwachstum, Abbau der Algen verbraucht Sauerstoff, Sauerstoffmangel und Tiere sterben.</desc>
  <rect width="780" height="140" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="15" fill="#1f2933">
<rect x="20" y="40" width="150" height="60" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="95.0" y="66.0" text-anchor="middle">Phosphat</text><text x="95.0" y="84.0" text-anchor="middle">im Abwasser</text><line x1="170" y1="70" x2="210" y2="70" stroke="#1f2933" stroke-width="2"/><polyline points="201.9,73.9 210,70 201.9,66.1" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="210" y="40" width="150" height="60" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="285.0" y="66.0" text-anchor="middle">mehr</text><text x="285.0" y="84.0" text-anchor="middle">Algenwachstum</text><line x1="360" y1="70" x2="400" y2="70" stroke="#1f2933" stroke-width="2"/><polyline points="391.9,73.9 400,70 391.9,66.1" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="400" y="40" width="150" height="60" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="475.0" y="66.0" text-anchor="middle">Abbau der Algen</text><text x="475.0" y="84.0" text-anchor="middle">verbraucht O₂</text><line x1="550" y1="70" x2="590" y2="70" stroke="#1f2933" stroke-width="2"/><polyline points="581.9,73.9 590,70 581.9,66.1" fill="none" stroke="#1f2933" stroke-width="2"/><rect x="590" y="40" width="150" height="60" rx="6" fill="#fbeee6" stroke="#c05621" stroke-width="1.5"/><text x="665.0" y="66.0" text-anchor="middle">Sauerstoffmangel,</text><text x="665.0" y="84.0" text-anchor="middle">Tiere sterben</text>
  </g>
</svg>
