<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="t d">
  <title id="t">Linde-Verfahren</title>
  <desc id="d">Luft wird verdichtet, gekühlt, im Gegenstrom-Wärmeaustauscher vorgekühlt und am Drosselventil entspannt. Dabei kühlt sie ab und wird flüssig. Die kalte entspannte Luft läuft im Gegenstrom zurück.</desc>
  <rect width="840" height="270" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="15" fill="#1f2933">
<rect x="20" y="80" width="90" height="50" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="65.0" y="110.0" text-anchor="middle">Luft</text><rect x="170" y="80" width="130" height="50" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="235.0" y="110.0" text-anchor="middle">Verdichter</text><rect x="330" y="80" width="130" height="50" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="395.0" y="110.0" text-anchor="middle">Kühler</text><rect x="490" y="80" width="150" height="50" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="565.0" y="101.0" text-anchor="middle">Gegenstrom-</text><text x="565.0" y="119.0" text-anchor="middle">Wärmeaustauscher</text><rect x="670" y="80" width="130" height="50" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="735.0" y="110.0" text-anchor="middle">Drosselventil</text><rect x="670" y="200" width="130" height="50" rx="6" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="735.0" y="230.0" text-anchor="middle">Flüssige Luft</text><line x1="110" y1="105" x2="170" y2="105" stroke="#1f2933" stroke-width="2"/><polyline points="161.9,108.9 170,105 161.9,101.1" fill="none" stroke="#1f2933" stroke-width="2"/><line x1="300" y1="105" x2="330" y2="105" stroke="#1f2933" stroke-width="2"/><polyline points="321.9,108.9 330,105 321.9,101.1" fill="none" stroke="#1f2933" stroke-width="2"/><line x1="460" y1="105" x2="490" y2="105" stroke="#1f2933" stroke-width="2"/><polyline points="481.9,108.9 490,105 481.9,101.1" fill="none" stroke="#1f2933" stroke-width="2"/><line x1="640" y1="105" x2="670" y2="105" stroke="#1f2933" stroke-width="2"/><polyline points="661.9,108.9 670,105 661.9,101.1" fill="none" stroke="#1f2933" stroke-width="2"/><line x1="735" y1="130" x2="735" y2="200" stroke="#1f2933" stroke-width="2"/><polyline points="731.1,191.9 735,200 738.9,191.9" fill="none" stroke="#1f2933" stroke-width="2"/><polyline points="670,225 565,225 565,130" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 5"/><line x1="565" y1="150" x2="565" y2="130" stroke="#2b6cb0" stroke-width="2"/><polyline points="568.9,138.1 565,130 561.1,138.1" fill="none" stroke="#2b6cb0" stroke-width="2"/><polyline points="565,80 565,40 235,40 235,80" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 5"/><line x1="235" y1="60" x2="235" y2="80" stroke="#2b6cb0" stroke-width="2"/><polyline points="231.1,71.9 235,80 238.9,71.9" fill="none" stroke="#2b6cb0" stroke-width="2"/><text x="400" y="30" text-anchor="middle" font-size="13" fill="#2b6cb0">kalte, entspannte Luft läuft im Gegenstrom zurück</text><text x="400" y="165" text-anchor="middle" font-size="13">komprimierte Luft</text><text x="400" y="185" text-anchor="middle" font-size="13">wird vorgekühlt</text>
