<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">Drehimpuls bei geradliniger Bewegung</title>
  <desc id="d">Ein Körper bewegt sich auf einer Geraden mit Impuls p. Bezogen auf einen Punkt im Abstand d von der Geraden hat er den Drehimpuls L gleich m v d, der aus der Zeichenebene zeigt.</desc>
  <rect width="760" height="400" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<line x1="60.0" y1="160.0" x2="700.0" y2="160.0" stroke="#9fb3c8" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="420.0" cy="160.0" r="9" fill="#1f2933" stroke="none" stroke-width="0"/><line x1="420.0" y1="160.0" x2="570.0" y2="160.0" stroke="#c05621" stroke-width="3.5"/><polyline points="559.9,164.3 570.0,160.0 559.9,155.7" fill="none" stroke="#c05621" stroke-width="3.5"/><text x="578.0" y="152.0" fill="#c05621" font-size="20" text-anchor="start" >p</text><line x1="150.0" y1="330.0" x2="415.0" y2="167.0" stroke="#2b6cb0" stroke-width="3.5"/><polyline points="408.6,176.0 415.0,167.0 404.1,168.7" fill="none" stroke="#2b6cb0" stroke-width="3.5"/><text x="260.0" y="230.0" fill="#2b6cb0" font-size="20" text-anchor="start" >r</text><line x1="150.0" y1="330.0" x2="150.0" y2="160.0" stroke="#9fb3c8" stroke-width="1.8" stroke-dasharray="4 4"/><text x="140.0" y="245.0" fill="#1f2933" font-size="18" text-anchor="end" >d</text><circle cx="150.0" cy="330.0" r="6" fill="#1f2933" stroke="none" stroke-width="0"/><text x="138.0" y="354.0" fill="#1f2933" font-size="16" text-anchor="end" >0</text><circle cx="560.0" cy="300.0" r="18" fill="none" stroke="#2f855a" stroke-width="3"/><circle cx="560.0" cy="300.0" r="5" fill="#2f855a" stroke="none" stroke-width="0"/><text x="560.0" y="350.0" fill="#2f855a" font-size="14" text-anchor="middle" >L zeigt aus der Zeichenebene</text><text x="200.0" y="60.0" fill="#1f2933" font-size="18" text-anchor="start" >L = r × p,   |L| = m v d</text><text x="200.0" y="88.0" fill="#1f2933" font-size="14" text-anchor="start" >Auch eine geradlinige Bewegung hat einen Drehimpuls,</text><text x="200.0" y="108.0" fill="#1f2933" font-size="14" text-anchor="start" >wenn man ihn auf einen Punkt neben der Bahn bezieht.</text>
  </g>
</svg>
