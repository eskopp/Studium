<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Gleichförmige Kreisbewegung</title>
  <desc id="d">Ein Punkt auf einer Kreisbahn mit Ortsvektor, tangentialer Geschwindigkeit und zum Mittelpunkt gerichteter Zentripetalbeschleunigung.</desc>
  <rect width="760" height="430" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<circle cx="360.0" cy="215.0" r="140" fill="none" stroke="#9fb3c8" stroke-width="2.5"/><circle cx="360.0" cy="215.0" r="5" fill="#1f2933" stroke="none" stroke-width="0"/><text x="348.0" y="237.0" fill="#1f2933" font-size="16" text-anchor="end" >0</text><line x1="360.0" y1="215.0" x2="520.0" y2="215.0" stroke="#9fb3c8" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="360.0" y1="215.0" x2="474.7" y2="134.7" stroke="#2b6cb0" stroke-width="1.8" stroke-dasharray="6 4"/><text x="400.4" y="178.9" fill="#2b6cb0" font-size="18" text-anchor="start" >r</text><line x1="474.7" y1="134.7" x2="411.6" y2="44.6" stroke="#c05621" stroke-width="3"/><polyline points="420.9,50.4 411.6,44.6 413.9,55.3" fill="none" stroke="#c05621" stroke-width="3"/><text x="404.7" y="33.1" fill="#c05621" font-size="18" text-anchor="start" >v</text><line x1="474.7" y1="134.7" x2="401.0" y2="186.3" stroke="#2f855a" stroke-width="3"/><polyline points="406.8,177.0 401.0,186.3 411.7,184.0" fill="none" stroke="#2f855a" stroke-width="3"/><text x="445.8" y="186.5" fill="#2f855a" font-size="18" text-anchor="start" >a_Z</text><circle cx="474.7" cy="134.7" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><path d="M415,215 A55,55 0 0 0 405.1,183.5" fill="none" stroke="#1f2933" stroke-width="1.8"/><text x="426.0" y="241.0" fill="#1f2933" font-size="16" text-anchor="start" >φ = ωt</text><text x="600.0" y="120.0" fill="#c05621" font-size="16" text-anchor="start" >v = ωR</text><text x="600.0" y="148.0" fill="#2f855a" font-size="16" text-anchor="start" >a_Z = ω²R = v²/R</text><text x="600.0" y="176.0" fill="#1f2933" font-size="16" text-anchor="start" >v ⊥ a_Z</text><text x="360.0" y="400.0" fill="#1f2933" font-size="14" text-anchor="middle" >Bei der gleichförmigen Kreisbewegung zeigt die Beschleunigung zum Mittelpunkt.</text>
  </g>
</svg>
