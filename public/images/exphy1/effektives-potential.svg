  <title id="t">Effektives Potential</title>
  <desc id="d">Das effektive Potential im Gravitationsfeld als Funktion des Abstands r. Das Minimum gehört zur Kreisbahn, eine negative Gesamtenergie zu einer Ellipse zwischen zwei Umkehrpunkten, eine positive zu einer Hyperbel.</desc>
