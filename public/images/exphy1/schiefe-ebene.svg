<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">Schiefe Ebene</title>
  <desc id="d">Ein Körper auf einer schiefen Ebene mit Neigungswinkel alpha. Die Gewichtskraft wird in Hangabtriebskraft und Normalkraft zerlegt, dazu wirken Zugkraft Z und Zwangskraft N.</desc>
  <rect width="760" height="420" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<polygon points="229.7,100.0 680.0,360.0 229.7,360.0" fill="#e4e7eb" stroke="#9fb3c8" stroke-width="2.5"/><polygon points="382.2,185.8 442.8,220.8 470.8,172.3 410.2,137.3" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><line x1="426.5" y1="179.0" x2="426.5" y2="279.0" stroke="#2b6cb0" stroke-width="3"/><polyline points="422.2,268.9 426.5,279.0 430.8,268.9" fill="none" stroke="#2b6cb0" stroke-width="3"/><text x="436.5" y="285.0" fill="#2b6cb0" font-size="16" text-anchor="start" >G = mg</text><line x1="426.5" y1="179.0" x2="469.8" y2="204.0" stroke="#c05621" stroke-width="3"/><polyline points="458.9,202.7 469.8,204.0 463.2,195.2" fill="none" stroke="#c05621" stroke-width="3"/><text x="477.8" y="226.0" fill="#c05621" font-size="15" text-anchor="start" >F_∥ = mg sin α</text><line x1="426.5" y1="179.0" x2="383.2" y2="254.0" stroke="#c05621" stroke-width="3" stroke-dasharray="6 4"/><polyline points="384.6,243.1 383.2,254.0 392.0,247.4" fill="none" stroke="#c05621" stroke-width="3"/><text x="377.2" y="284.0" fill="#c05621" font-size="15" text-anchor="end" >F_⊥ = mg cos α</text><line x1="426.5" y1="179.0" x2="469.8" y2="104.0" stroke="#2f855a" stroke-width="3"/><polyline points="468.5,114.9 469.8,104.0 461.1,110.7" fill="none" stroke="#2f855a" stroke-width="3"/><text x="477.8" y="100.0" fill="#2f855a" font-size="17" text-anchor="start" >N</text><line x1="426.5" y1="179.0" x2="383.2" y2="154.0" stroke="#6b46c1" stroke-width="3"/><polyline points="394.1,155.4 383.2,154.0 389.9,162.8" fill="none" stroke="#6b46c1" stroke-width="3"/><text x="375.2" y="144.0" fill="#6b46c1" font-size="17" text-anchor="end" >Z</text><path d="M610,360 A70,70 0 0 1 619.4,325.0" fill="none" stroke="#1f2933" stroke-width="1.8"/><text x="598.0" y="350.0" fill="#1f2933" font-size="17" text-anchor="end" >α</text><text x="70.0" y="60.0" fill="#1f2933" font-size="15" text-anchor="start" >Im Gleichgewicht ist F_∥ + Z + F_⊥ + N = 0.</text><text x="70.0" y="84.0" fill="#1f2933" font-size="15" text-anchor="start" >Z = −F_∥ hält den Körper, N = −F_⊥ trägt ihn.</text>
  </g>
</svg>
