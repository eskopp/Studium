<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">Impulskreis beim elastischen Stoß</title>
  <desc id="d">Ein Kreis mit dem Radius mu mal v1 um den Punkt (mu v1, 0). Der Anfangsimpuls p1 ist der Durchmesser, die Spitze von p2-Strich liegt auf dem Kreis, und bei gleichen Massen stehen p1-Strich und p2-Strich senkrecht aufeinander.</desc>
  <rect width="760" height="360" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<line x1="40.0" y1="190.0" x2="334.5" y2="190.0" stroke="#1f2933" stroke-width="1.5"/><polyline points="327.1,193.1 334.5,190.0 327.1,186.9" fill="none" stroke="#1f2933" stroke-width="1.5"/><text x="334.5" y="214.0" fill="#1f2933" font-size="16" text-anchor="end" >x</text><circle cx="185.0" cy="190.0" r="115.0" fill="none" stroke="#9fb3c8" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="185.0" cy="190.0" r="4" fill="#9fb3c8" stroke="none" stroke-width="0"/><line x1="70.0" y1="190.0" x2="296.0" y2="190.0" stroke="#2b6cb0" stroke-width="3.5"/><polyline points="285.9,194.3 296.0,190.0 285.9,185.7" fill="none" stroke="#2b6cb0" stroke-width="3.5"/><text x="185.0" y="216.0" fill="#2b6cb0" font-size="18" text-anchor="middle" >p₁</text><line x1="70.0" y1="190.0" x2="205.0" y2="76.7" stroke="#c05621" stroke-width="3.5"/><polyline points="200.0,86.5 205.0,76.7 194.5,80.0" fill="none" stroke="#c05621" stroke-width="3.5"/><text x="119.5" y="133.4" fill="#c05621" font-size="18" text-anchor="start" >p₂′</text><line x1="205.0" y1="76.7" x2="296.0" y2="190.0" stroke="#2f855a" stroke-width="3.5"/><polyline points="286.3,184.8 296.0,190.0 293.0,179.4" fill="none" stroke="#2f855a" stroke-width="3.5"/><text x="260.5" y="129.4" fill="#2f855a" font-size="18" text-anchor="start" >p₁′</text><circle cx="205.0" cy="76.7" r="6" fill="#1f2933" stroke="none" stroke-width="0"/><text x="400.0" y="60.0" fill="#1f2933" font-size="15" text-anchor="start" >Gleiche Massen: μ = m/2,</text><text x="400.0" y="84.0" fill="#1f2933" font-size="15" text-anchor="start" >p₁ ist der Durchmesser.</text><text x="400.0" y="112.0" fill="#1f2933" font-size="15" text-anchor="start" >Satz des Thales: p₁′ ⊥ p₂′.</text><text x="400.0" y="150.0" fill="#9fb3c8" font-size="14" text-anchor="start" >Die Spitze von p₂′ liegt immer</text><text x="400.0" y="170.0" fill="#9fb3c8" font-size="14" text-anchor="start" >auf dem Kreis um (μ v₁, 0)</text><text x="400.0" y="190.0" fill="#9fb3c8" font-size="14" text-anchor="start" >mit Radius μ v₁.</text>
  </g>
</svg>
