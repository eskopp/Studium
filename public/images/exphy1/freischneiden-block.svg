242.0" fill="none" stroke="#1f2933" stroke-width="1.8"/><text x="368.0" y="260.0" fill="#1f2933" font-size="17" text-anchor="start" >θ</text><text x="500.0" y="70.0" fill="#1f2933" font-size="15" text-anchor="start" >senkrecht: −G + N + T sin θ = 0</text><text x="500.0" y="96.0" fill="#1f2933" font-size="15" text-anchor="start" >waagerecht: T cos θ = m a</text><text x="500.0" y="126.0" fill="#1f2933" font-size="15" text-anchor="start" >Normalkraft: N = G − T sin θ</text>
