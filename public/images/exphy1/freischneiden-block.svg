  <title id="t">Freischneiden: gezogener Block</title>
  <desc id="d">Ein Block auf einer glatten Unterlage wird mit einem Seil unter dem Winkel theta gezogen. Eingezeichnet sind Gewichtskraft, Normalkraft und die Seilkraft mit ihren beiden Komponenten.</desc>
