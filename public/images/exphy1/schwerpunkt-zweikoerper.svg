<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
  <title id="t">Massenmittelpunkt zweier Körper</title>
  <desc id="d">Zwei Massen m1 und m2 mit Ortsvektoren r1 und r2. Der Schwerpunkt S liegt auf der Verbindungslinie, näher an der größeren Masse.</desc>
  <rect width="760" height="380" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<line x1="90.0" y1="330.0" x2="700.0" y2="330.0" stroke="#1f2933" stroke-width="2.5"/><polyline points="689.9,334.3 700.0,330.0 689.9,325.7" fill="none" stroke="#1f2933" stroke-width="2.5"/><line x1="90.0" y1="330.0" x2="90.0" y2="60.0" stroke="#1f2933" stroke-width="2.5"/><polyline points="94.3,70.1 90.0,60.0 85.7,70.1" fill="none" stroke="#1f2933" stroke-width="2.5"/><text x="700.0" y="354.0" fill="#1f2933" font-size="16" text-anchor="end" >x</text><text x="80.0" y="68.0" fill="#1f2933" font-size="16" text-anchor="end" >y</text><line x1="220.0" y1="150.0" x2="560.0" y2="260.0" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="6 5"/><circle cx="220.0" cy="150.0" r="16" fill="#2b6cb0" stroke="none" stroke-width="0"/><text x="220.0" y="124.0" fill="#2b6cb0" font-size="17" text-anchor="middle" >m₁</text><circle cx="560.0" cy="260.0" r="10" fill="#c05621" stroke="none" stroke-width="0"/><text x="560.0" y="290.0" fill="#c05621" font-size="17" text-anchor="middle" >m₂</text><circle cx="333.3" cy="186.7" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="329.3" y="172.7" fill="#1f2933" font-size="18" text-anchor="end" >S</text><line x1="90.0" y1="330.0" x2="214.0" y2="158.0" stroke="#2b6cb0" stroke-width="2.5"/><polyline points="211.5,168.7 214.0,158.0 204.6,163.7" fill="none" stroke="#2b6cb0" stroke-width="2.5"/><text x="150.0" y="230.0" fill="#2b6cb0" font-size="17" text-anchor="start" >r₁</text><line x1="90.0" y1="330.0" x2="552.0" y2="264.0" stroke="#c05621" stroke-width="2.5"/><polyline points="542.6,269.7 552.0,264.0 541.4,261.2" fill="none" stroke="#c05621" stroke-width="2.5"/><text x="340.0" y="320.0" fill="#c05621" font-size="17" text-anchor="start" >r₂</text><line x1="90.0" y1="330.0" x2="327.3" y2="190.7" stroke="#1f2933" stroke-width="3"/><polyline points="320.8,199.5 327.3,190.7 316.4,192.1" fill="none" stroke="#1f2933" stroke-width="3"/><text x="300.0" y="278.0" fill="#1f2933" font-size="17" text-anchor="start" >r_S</text><text x="430.0" y="70.0" fill="#1f2933" font-size="17" text-anchor="start" >r_S = (m₁ r₁ + m₂ r₂) / (m₁ + m₂)</text><text x="430.0" y="98.0" fill="#1f2933" font-size="14" text-anchor="start" >Der Schwerpunkt liegt auf der Verbindungslinie,</text><text x="430.0" y="118.0" fill="#1f2933" font-size="14" text-anchor="start" >näher am schwereren Körper (hier m₁ = 2 m₂).</text>
  </g>
</svg>
