<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
  <title id="t">Rollendes Rad</title>
  <desc id="d">Ein Rad rollt ohne Rutschen. Der Mittelpunkt hat die Geschwindigkeit v_S, der höchste Punkt die doppelte Geschwindigkeit, der Berührpunkt mit dem Boden ruht.</desc>
  <rect width="760" height="380" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<line x1="60.0" y1="310.0" x2="700.0" y2="310.0" stroke="#1f2933" stroke-width="3"/><circle cx="380.0" cy="200.0" r="110" fill="#edf2f7" stroke="#1f2933" stroke-width="2.5"/><circle cx="380.0" cy="200.0" r="5" fill="#1f2933" stroke="none" stroke-width="0"/><text x="390.0" y="190.0" fill="#1f2933" font-size="17" text-anchor="start" >S</text><line x1="380.0" y1="200.0" x2="490.0" y2="200.0" stroke="#c05621" stroke-width="3.5"/><polyline points="479.9,204.3 490.0,200.0 479.9,195.7" fill="none" stroke="#c05621" stroke-width="3.5"/><text x="498.0" y="206.0" fill="#c05621" font-size="17" text-anchor="start" >v_S</text><line x1="380.0" y1="90.0" x2="590.0" y2="90.0" stroke="#2f855a" stroke-width="3.5"/><polyline points="579.9,94.3 590.0,90.0 579.9,85.7" fill="none" stroke="#2f855a" stroke-width="3.5"/><text x="598.0" y="96.0" fill="#2f855a" font-size="17" text-anchor="start" >v = 2 v_S</text><circle cx="380.0" cy="90.0" r="6" fill="#1f2933" stroke="none" stroke-width="0"/><circle cx="380.0" cy="310.0" r="6" fill="#1f2933" stroke="none" stroke-width="0"/><text x="394.0" y="336.0" fill="#1f2933" font-size="15" text-anchor="start" >v = 0 (Berührpunkt)</text><line x1="240.0" y1="200.0" x2="240.0" y2="200.0" stroke="#1f2933" stroke-width="0"/><polyline points="229.9,204.3 240.0,200.0 229.9,195.7" fill="none" stroke="#1f2933" stroke-width="0"/><path d="M330,210 A50,50 0 1 0 430,210" fill="none" stroke="#6b46c1" stroke-width="2.2"/><text x="376.0" y="250.0" fill="#6b46c1" font-size="18" text-anchor="middle" >ω</text><text x="40.0" y="50.0" fill="#1f2933" font-size="17" text-anchor="start" >v_i = v_S + ω × r_iS,  v_S = ω R</text><text x="40.0" y="76.0" fill="#1f2933" font-size="14" text-anchor="start" >Rollen ohne Rutschen: Der Berührpunkt ruht.</text>
  </g>
</svg>
