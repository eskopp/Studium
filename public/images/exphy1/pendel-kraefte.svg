  <title id="t">Mathematisches Pendel</title>
  <desc id="d">Ein Pendel mit Fadenlänge l und Auslenkwinkel phi. Die Gewichtskraft wird in eine Komponente entlang des Fadens und eine tangential zur Bahn zerlegt, dazu wirkt die Fadenkraft.</desc>
  <rect width="760" height="420" rx="8" fill="#f7f8fa"/>
