<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">Elastischer Stoß im Schwerpunktsystem</title>
  <desc id="d">Zwei Impulsvektoren gleichen Betrags zeigen vor dem Stoß in entgegengesetzte Richtungen. Nach dem Stoß sind beide um den Winkel theta gedreht, ihre Beträge sind unverändert, die Spitzen liegen auf demselben Kreis.</desc>
  <rect width="820" height="420" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" fill="#1f2933"><circle cx="330" cy="210" r="150" fill="none" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="3 6"/><line x1="330" y1="210" x2="474.9" y2="248.8" stroke="#2b6cb0" stroke-width="3"/><polyline points="464.0,250.3 474.9,248.8 466.2,242.1" fill="none" stroke="#2b6cb0" stroke-width="3"/><text x="502.2" y="262.0" fill="#2b6cb0" font-size="17" text-anchor="middle">p₁S vorher</text><line x1="330" y1="210" x2="185.1" y2="171.2" stroke="#2b6cb0" stroke-width="3"/><polyline points="196.0,169.7 185.1,171.2 193.8,177.9" fill="none" stroke="#2b6cb0" stroke-width="3"/><text x="157.8" y="164.0" fill="#2b6cb0" font-size="17" text-anchor="middle">p₂S vorher</text><line x1="330" y1="210" x2="416.0" y2="87.1" stroke="#c05621" stroke-width="3"/><polyline points="413.7,97.9 416.0,87.1 406.7,93.0" fill="none" stroke="#c05621" stroke-width="3"/><text x="433.5" y="66.7" fill="#c05621" font-size="17" text-anchor="middle">p₁S′ nachher</text><line x1="330" y1="210" x2="244.0" y2="332.9" stroke="#c05621" stroke-width="3"/><polyline points="246.3,322.1 244.0,332.9 253.3,327.0" fill="none" stroke="#c05621" stroke-width="3"/><text x="226.5" y="365.3" fill="#c05621" font-size="17" text-anchor="middle">p₂S′ nachher</text><path d="M388.0,225.5 A60,60 0 0 0 364.4,160.9" fill="none" stroke="#1f2933" stroke-width="2"/><text x="403.3" y="188.3" font-size="17" text-anchor="middle">ϑ</text><circle cx="330" cy="210" r="5" fill="#1f2933"/><text x="316" y="232" font-size="17" text-anchor="middle">S</text><text x="560" y="150" font-size="15">Im Schwerpunktsystem S gilt:</text><text x="560" y="176" font-size="15">p₁S = −p₂S, vorher und nachher.</text><text x="560" y="214" font-size="15">Beim elastischen Stoß bleiben</text><text x="560" y="240" font-size="15">die Beträge gleich, die Vektoren</text><text x="560" y="266" font-size="15">drehen sich um den Winkel ϑ.</text></g>
</svg>
