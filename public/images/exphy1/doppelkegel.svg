<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">Doppelkegel in der Hohlkugel</title>
  <desc id="d">Ein Punkt P im Inneren einer Kugelschale. Ein schmaler Doppelkegel mit der Spitze in P schneidet zwei gegenüberliegende Flächenstücke A1 und A2 heraus. Ihre Massen verhalten sich wie die Quadrate der Abstände, die Kräfte in P sind gleich groß und entgegengesetzt.</desc>
  <rect width="760" height="420" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<circle cx="250.0" cy="215.0" r="170" fill="#edf2f7" stroke="#1f2933" stroke-width="2.5"/><text x="250.0" y="31.0" fill="#1f2933" font-size="15" text-anchor="middle" >Kugelschale (Hohlkugel)</text><circle cx="180.0" cy="255.0" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="168.0" y="277.0" fill="#1f2933" font-size="16" text-anchor="end" >P</text><line x1="180.0" y1="255.0" x2="387.5" y2="115.0" stroke="#2b6cb0" stroke-width="1.8"/><line x1="180.0" y1="255.0" x2="419.4" y2="229.8" stroke="#2b6cb0" stroke-width="1.8"/><line x1="180.0" y1="255.0" x2="105.8" y2="305.0" stroke="#2b6cb0" stroke-width="1.8"/><line x1="180.0" y1="255.0" x2="87.4" y2="264.7" stroke="#2b6cb0" stroke-width="1.8"/><line x1="387.5" y1="115.0" x2="419.4" y2="229.8" stroke="#c05621" stroke-width="6"/><line x1="105.8" y1="305.0" x2="87.4" y2="264.7" stroke="#2f855a" stroke-width="6"/><text x="417.4" y="176.4" fill="#c05621" font-size="17" text-anchor="start" >A₁</text><text x="82.6" y="288.9" fill="#2f855a" font-size="17" text-anchor="end" >A₂</text><text x="134.3" y="291.9" fill="#2f855a" font-size="16" text-anchor="start" >r₂</text><text x="291.7" y="203.7" fill="#c05621" font-size="16" text-anchor="start" >r₁</text><text x="450.0" y="130.0" fill="#1f2933" font-size="17" text-anchor="start" >A₁ / A₂ = r₁² / r₂²</text><text x="450.0" y="158.0" fill="#1f2933" font-size="17" text-anchor="start" >also M₁ / M₂ = r₁² / r₂²</text><text x="450.0" y="186.0" fill="#1f2933" font-size="16" text-anchor="start" >F₁ ∝ M₁ / r₁²  und  F₂ ∝ M₂ / r₂²</text><text x="450.0" y="214.0" fill="#2f855a" font-size="16" text-anchor="start" >gleich groß, entgegengesetzt:</text><text x="450.0" y="238.0" fill="#2f855a" font-size="16" text-anchor="start" >Die Kräfte heben sich in P auf.</text>
  </g>
</svg>
