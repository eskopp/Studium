<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">Galilei-Transformation</title>
  <desc id="d">Zwei Koordinatensysteme S und S-Strich. S-Strich bewegt sich mit der Geschwindigkeit V relativ zu S. Der Punkt P hat in S den Ortsvektor r und in S-Strich den Ortsvektor r-Strich, es gilt r-Strich gleich r minus V t.</desc>
  <rect width="760" height="400" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<line x1="90.0" y1="330.0" x2="700.0" y2="330.0" stroke="#1f2933" stroke-width="2.5"/><polyline points="689.9,334.3 700.0,330.0 689.9,325.7" fill="none" stroke="#1f2933" stroke-width="2.5"/><line x1="90.0" y1="330.0" x2="90.0" y2="70.0" stroke="#1f2933" stroke-width="2.5"/><polyline points="94.3,80.1 90.0,70.0 85.7,80.1" fill="none" stroke="#1f2933" stroke-width="2.5"/><text x="700.0" y="354.0" fill="#1f2933" font-size="16" text-anchor="end" >x</text><text x="80.0" y="78.0" fill="#1f2933" font-size="16" text-anchor="end" >y</text><text x="80.0" y="352.0" fill="#1f2933" font-size="16" text-anchor="end" >S</text><line x1="300.0" y1="290.0" x2="630.0" y2="290.0" stroke="#9fb3c8" stroke-width="2"/><polyline points="619.9,294.3 630.0,290.0 619.9,285.7" fill="none" stroke="#9fb3c8" stroke-width="2"/><text x="636.0" y="296.0" fill="#9fb3c8" font-size="16" text-anchor="start" >x′</text><line x1="300.0" y1="290.0" x2="300.0" y2="80.0" stroke="#9fb3c8" stroke-width="2"/><polyline points="304.3,90.1 300.0,80.0 295.7,90.1" fill="none" stroke="#9fb3c8" stroke-width="2"/><text x="310.0" y="86.0" fill="#9fb3c8" font-size="16" text-anchor="start" >y′</text><text x="290.0" y="310.0" fill="#9fb3c8" font-size="16" text-anchor="end" >S′</text><line x1="300.0" y1="290.0" x2="300.0" y2="330.0" stroke="#9fb3c8" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="90.0" y1="330.0" x2="296.0" y2="292.0" stroke="#c05621" stroke-width="3"/><polyline points="286.8,298.1 296.0,292.0 285.3,289.6" fill="none" stroke="#c05621" stroke-width="3"/><text x="150.0" y="268.0" fill="#c05621" font-size="17" text-anchor="start" >R = Vt</text><line x1="90.0" y1="330.0" x2="520.0" y2="170.0" stroke="#2b6cb0" stroke-width="3.5"/><polyline points="512.0,177.5 520.0,170.0 509.0,169.5" fill="none" stroke="#2b6cb0" stroke-width="3.5"/><text x="300.0" y="222.0" fill="#2b6cb0" font-size="19" text-anchor="start" >r</text><line x1="300.0" y1="290.0" x2="516.0" y2="172.0" stroke="#2f855a" stroke-width="3.5"/><polyline points="509.2,180.6 516.0,172.0 505.1,173.1" fill="none" stroke="#2f855a" stroke-width="3.5"/><text x="440.0" y="230.0" fill="#2f855a" font-size="19" text-anchor="start" >r′</text><circle cx="520.0" cy="170.0" r="7" fill="#1f2933" stroke="none" stroke-width="0"/><text x="530.0" y="162.0" fill="#1f2933" font-size="16" text-anchor="start" >P</text><line x1="310.0" y1="282.0" x2="410.0" y2="282.0" stroke="#6b46c1" stroke-width="2.5"/><polyline points="399.9,286.3 410.0,282.0 399.9,277.7" fill="none" stroke="#6b46c1" stroke-width="2.5"/><text x="420.0" y="278.0" fill="#6b46c1" font-size="17" text-anchor="start" >V</text><text x="430.0" y="80.0" fill="#1f2933" font-size="17" text-anchor="start" >r′ = r − Vt,  t′ = t</text><text x="430.0" y="106.0" fill="#1f2933" font-size="17" text-anchor="start" >v′ = v − V,  a′ = a</text><text x="430.0" y="132.0" fill="#1f2933" font-size="13" text-anchor="start" >S′ bewegt sich mit V relativ zu S.</text>
  </g>
</svg>
