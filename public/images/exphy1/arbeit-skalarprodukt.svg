<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">Arbeit als Skalarprodukt</title>
  <desc id="d">Ein Kraftvektor F und ein Wegvektor Delta r schließen den Winkel alpha ein. Die Arbeit ist das Produkt aus der Kraftkomponente in Wegrichtung und der Weglänge.</desc>
  <rect width="760" height="400" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<line x1="150.0" y1="300.0" x2="380.0" y2="150.0" stroke="#2b6cb0" stroke-width="3.5"/><polyline points="373.9,159.1 380.0,150.0 369.2,151.9" fill="none" stroke="#2b6cb0" stroke-width="3.5"/><text x="390.0" y="146.0" fill="#2b6cb0" font-size="20" text-anchor="start" >F</text><line x1="150.0" y1="300.0" x2="520.0" y2="300.0" stroke="#c05621" stroke-width="3.5"/><polyline points="509.9,304.3 520.0,300.0 509.9,295.7" fill="none" stroke="#c05621" stroke-width="3.5"/><text x="530.0" y="306.0" fill="#c05621" font-size="20" text-anchor="start" >Δr</text><line x1="380.0" y1="150.0" x2="380.0" y2="300.0" stroke="#9fb3c8" stroke-width="1.8" stroke-dasharray="6 5"/><line x1="150.0" y1="334.0" x2="380.0" y2="334.0" stroke="#2f855a" stroke-width="3"/><polyline points="369.9,338.3 380.0,334.0 369.9,329.7" fill="none" stroke="#2f855a" stroke-width="3"/><text x="265.0" y="362.0" fill="#2f855a" font-size="16" text-anchor="middle" >F_r = F cos α</text><path d="M220,300 A70,70 0 0 0 208.6,261.8" fill="none" stroke="#1f2933" stroke-width="1.8"/><text x="232.0" y="282.0" fill="#1f2933" font-size="18" text-anchor="start" >α</text><text x="150.0" y="60.0" fill="#1f2933" font-size="18" text-anchor="start" >ΔW = F · Δr = F Δr cos α = F_r Δr</text><text x="150.0" y="88.0" fill="#1f2933" font-size="14" text-anchor="start" >Nur der Teil der Kraft in Wegrichtung verrichtet Arbeit.</text>
  </g>
</svg>
