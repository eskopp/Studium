<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">Arbeit beim Dehnen einer Feder</title>
  <desc id="d">Ein Kraft-Weg-Diagramm mit einer Geraden F gleich k mal Dehnung. Die Fläche unter der Geraden ist ein Dreieck und entspricht der Federenergie ein halb k mal Dehnung zum Quadrat.</desc>
  <rect width="760" height="400" rx="8" fill="#f7f8fa"/>
  <g font-family="sans-serif" font-size="16" fill="#1f2933">
<line x1="110.0" y1="340.0" x2="690.0" y2="340.0" stroke="#1f2933" stroke-width="2.5"/><polyline points="679.9,344.3 690.0,340.0 679.9,335.7" fill="none" stroke="#1f2933" stroke-width="2.5"/><line x1="110.0" y1="340.0" x2="110.0" y2="40.0" stroke="#1f2933" stroke-width="2.5"/><polyline points="114.3,50.1 110.0,40.0 105.7,50.1" fill="none" stroke="#1f2933" stroke-width="2.5"/><text x="690.0" y="364.0" fill="#1f2933" font-size="16" text-anchor="end" >x − x₀</text><text x="98.0" y="48.0" fill="#1f2933" font-size="16" text-anchor="end" >F</text><line x1="110.0" y1="340.0" x2="620.0" y2="40.0" stroke="#2b6cb0" stroke-width="3.5"/><text x="628.0" y="44.0" fill="#2b6cb0" font-size="16" text-anchor="start" >F = k (x − x₀)</text><polygon points="110.0,340.0 467.0,340.0 467.0,130.0" fill="#bee3f8" stroke="none" stroke-width="0"/><polygon points="110.0,340.0 467.0,340.0 467.0,130.0" fill="none" stroke="#c05621" stroke-width="2.5"/><line x1="467.0" y1="340.0" x2="467.0" y2="130.0" stroke="#9fb3c8" stroke-width="1.5" stroke-dasharray="5 5"/><text x="467.0" y="364.0" fill="#1f2933" font-size="16" text-anchor="middle" >x</text><text x="479.0" y="243.0" fill="#1f2933" font-size="16" text-anchor="start" >F(x)</text><text x="254.5" y="312.5" fill="#c05621" font-size="16" text-anchor="start" >W = ½ k (x − x₀)²</text><text x="120.0" y="60.0" fill="#1f2933" font-size="15" text-anchor="start" >Die Arbeit beim Dehnen ist die Fläche unter der Kraft.</text><text x="120.0" y="84.0" fill="#1f2933" font-size="15" text-anchor="start" >Das Dreieck hat die Fläche ½ · Grundseite · Höhe.</text>
  </g>
</svg>
